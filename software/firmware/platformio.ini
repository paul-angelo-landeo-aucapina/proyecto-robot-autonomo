; PlatformIO Project Configuration File for 2WD Mini Autonomous Robot
; Architecture: ESP32 Single MCU + TB6612FNG + MPU6050 + 2x VL53L0X

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D CORE_DEBUG_LEVEL=2
    -I include

lib_deps =
    adafruit/Adafruit_VL53L0X @ ^1.2.4
    Wire
